name: Build FAP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: host tests
    steps:
      - uses: actions/checkout@v4

      # The POCSAG decoder, the BCH tables, the generator, the grading engine
      # and the session log are all free of furi_ headers, so they run on the
      # runner under ASan/UBSan against the same sources the .fap is built from.
      - name: Run host tests
        run: make -C test

      # The mockup dumper shares every source file with the app, so a change
      # that breaks it breaks the README screenshots too. Cheap to catch here.
      - name: Build the mockup data dumper
        run: make -C test host_mockup_dump

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    name: ufbt (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python3 -m pip install --upgrade ufbt

      - name: Sync SDK (${{ matrix.channel }})
        run: ufbt update --channel=${{ matrix.channel }}

      - name: Build Pheme
        run: ufbt

      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: pheme-fap-${{ matrix.channel }}
          path: dist/*.fap
          if-no-files-found: error
